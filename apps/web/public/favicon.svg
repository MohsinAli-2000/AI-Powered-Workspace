<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111528" />
      <stop offset="100%" stop-color="#1a153a" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Main Sparkle Core Gradient -->
    <linearGradient id="coreGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Core Inner Highlight Gradient -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#e0e7ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Secondary Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Filter Blur -->
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36" result="blur" />
    </filter>
    <filter id="microGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Depth Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Ambient Glow Behind Core -->
  <circle cx="256" cy="256" r="140" fill="url(#ambientGlow)" filter="url(#glowBlur)" />

  <!-- Subtle Concentric Knowledge Orbit Arcs -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="12 16" />
  <circle cx="256" cy="256" r="128" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 12" />

  <!-- Primary Intelligence Sparkle Star (Concave 4-Pointed Star) -->
  <path
    d="M 256 80
       C 256 177.2 294.8 216 392 216
       C 294.8 216 256 254.8 256 352
       C 256 254.8 217.2 216 120 216
       C 217.2 216 256 177.2 256 80 Z"
    fill="url(#coreGrad)"
    filter="url(#microGlow)"
  />

  <!-- Specular Center Highlight -->
  <path
    d="M 256 136
       C 256 195.4 278.6 216 336 216
       C 278.6 216 256 238.6 256 296
       C 256 238.6 233.4 216 176 216
       C 233.4 216 256 195.4 256 136 Z"
    fill="url(#innerGlow)"
  />

  <!-- Bright Core Center Node -->
  <circle cx="256" cy="216" r="14" fill="#ffffff" filter="url(#microGlow)" />

  <!-- Companion AI Sparkle (Top-Right) -->
  <path
    d="M 374 96
       C 374 133.6 388.4 148 426 148
       C 388.4 148 374 162.4 374 200
       C 374 162.4 359.6 148 322 148
       C 359.6 148 374 133.6 374 96 Z"
    fill="url(#starGrad)"
    filter="url(#microGlow)"
  />
  <circle cx="374" cy="148" r="5" fill="#ffffff" />

  <!-- Neural Knowledge Data Orbs / Satellite Dots -->
  <circle cx="152" cy="336" r="8" fill="#38bdf8" opacity="0.85" filter="url(#microGlow)" />
  <circle cx="360" cy="348" r="9" fill="#c084fc" opacity="0.85" filter="url(#microGlow)" />
  <circle cx="256" cy="410" r="11" fill="#6366f1" opacity="0.9" filter="url(#microGlow)" />

  <!-- Dynamic Connecting Network Lines to Satellite Nodes -->
  <line x1="256" y1="352" x2="256" y2="400" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="4 4" />
  <line x1="200" y1="290" x2="160" y2="330" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="4 4" />
  <line x1="312" y1="290" x2="352" y2="340" stroke="#c084fc" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="4 4" />
</svg>