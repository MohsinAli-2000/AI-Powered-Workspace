[tool.pyright]
venvPath = "apps/worker"
venv = ".venv"
extraPaths = ["apps/worker", "apps/worker/src"]
reportMissingImports = false
reportMissingTypeStubs = false

[tool.pyrefly]
python-interpreter = "apps/worker/.venv/bin/python"
search-path = [
    "apps/worker",
    "apps/worker/src",
]

[tool.pyrefly.errors]
missing-import = "ignore"
missing-attribute = "ignore"
unsupported-operation = "ignore"
untyped-import = "ignore"



